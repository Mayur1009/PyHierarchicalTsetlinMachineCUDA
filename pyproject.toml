[tool.ruff.format]
indent-style = "tab"

[tool.ruff]
line-length = 120

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12" }]

[tool.pixi.dependencies]
python = "<3.14"
cuda = ">=12.0,<13.0"
ipdb = ">=0.13.13"
jupyterlab = ">=4.5.6"
pygraphviz = ">=1.14"
marimo = ">=0.24.0"

[tool.pixi.pypi-dependencies]
PyHierarchicalTsetlinMachineCUDA = { path = ".", editable = true, extras = ["examples"] }

